<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root { --sakura:#f2a7b8; --deep:#1a0a0f; --cream:#fdf8f5; --gold:#c9a96e; --accent:#c0004e; --border:#e8e8e8; }
html { scroll-behavior:smooth; }
body { font-family:'Noto Sans JP',sans-serif; background:#fafafa; color:#222; min-height:100vh; }

nav { position:fixed; top:0; left:0; right:0; z-index:100; padding:16px 24px; display:flex; align-items:center; gap:16px; background:rgba(26,10,15,0.92); backdrop-filter:blur(8px); }
.nav-back { display:flex; align-items:center; gap:8px; color:rgba(253,248,245,0.7); text-decoration:none; font-size:.82rem; letter-spacing:.1em; text-transform:uppercase; font-family:'Cormorant Garamond',serif; transition:color .2s; }
.nav-back:hover { color:var(--sakura); }
.nav-back svg { width:16px; height:16px; fill:currentColor; }
.nav-divider { width:1px; height:18px; background:rgba(255,255,255,.2); }
.nav-title { font-family:'Noto Serif JP',serif; font-size:.95rem; letter-spacing:.25em; color:var(--cream); }

.page-header { margin-top:56px; padding:52px 0 40px; text-align:center; background:linear-gradient(160deg,#1a0a0f 0%,#2d0f1e 60%,#1a0a0f 100%); position:relative; overflow:hidden; }
.page-header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(to right,transparent,var(--gold),transparent); }
.page-header-title { font-family:'Cormorant Garamond',serif; font-size:clamp(2rem,6vw,3.5rem); font-weight:300; letter-spacing:.5em; text-transform:uppercase; background:linear-gradient(135deg,#fff 0%,var(--sakura) 50%,var(--gold) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.page-header-sub { font-size:.78rem; color:rgba(253,248,245,.4); letter-spacing:.3em; margin-top:.8rem; text-transform:uppercase; font-family:'Cormorant Garamond',serif; }

.yt-wrap { max-width:1100px; margin:0 auto; padding:40px 24px 80px; }

/* チャンネルブロック */
.channel-block { margin-bottom:60px; }
.channel-header { display:flex; align-items:center; gap:12px; margin-bottom:24px; padding-bottom:14px; border-left:3px solid #222; padding-left:14px; }
.channel-name { font-size:1.05rem; font-weight:700; color:#111; letter-spacing:.03em; }
.channel-link { display:flex; align-items:center; justify-content:center; width:34px; height:34px; background:#ff0000; border-radius:5px; text-decoration:none; flex-shrink:0; transition:opacity .2s; }
.channel-link:hover { opacity:.8; }
.channel-link svg { width:18px; height:18px; fill:#fff; }
.channel-sub { font-size:.78rem; color:#888; margin-top:2px; }

.video-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px 16px; }

.video-card { display:block; text-decoration:none; color:inherit; cursor:pointer; }
.video-thumb { width:100%; aspect-ratio:16/9; overflow:hidden; background:#e0e0e0; border-radius:6px; position:relative; }
.video-thumb img { width:100%; height:100%; object-fit:cover; transition:transform .4s; display:block; }
.video-card:hover .video-thumb img { transform:scale(1.05); }
.video-overlay { position:absolute; inset:0; background:rgba(0,0,0,.12); display:flex; align-items:center; justify-content:center; transition:background .3s; }
.video-card:hover .video-overlay { background:rgba(0,0,0,.35); }
.video-play { width:36px; height:36px; border-radius:50%; border:2px solid rgba(255,255,255,.85); display:flex; align-items:center; justify-content:center; }
.video-play::after { content:''; border-style:solid; border-width:6px 0 6px 12px; border-color:transparent transparent transparent rgba(255,255,255,.9); margin-left:3px; }
.video-info { margin-top:8px; }
.video-title { font-size:.8rem; color:#222; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; transition:color .2s; }
.video-card:hover .video-title { color:var(--accent); }
.video-date { font-size:.7rem; color:#aaa; margin-top:4px; }

footer { text-align:center; padding:28px 20px; border-top:1px solid #eee; font-size:.72rem; color:#aaa; letter-spacing:.2em; font-family:'Cormorant Garamond',serif; background:#fff; }

@media (max-width:860px) { .video-grid { grid-template-columns:repeat(3,1fr); } }
@media (max-width:600px) { .video-grid { grid-template-columns:repeat(2,1fr); gap:14px 10px; } }
</style>
</head>

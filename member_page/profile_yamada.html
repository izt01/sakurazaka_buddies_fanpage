<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山田 桃実 | 櫻坂46</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --sakura:#f2a7b8; --deep:#1a0a0f; --cream:#fdf8f5;
  --gold:#c9a96e; --accent:#c0004e; --border:#e8e0dc;
  --bg:#f8f5f2; --text:#1a1a1a;
}
html { scroll-behavior:smooth; }
body { font-family:'Noto Sans JP',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }

/* ══ NAV ══ */
nav {
  position:fixed; top:0; left:0; right:0; z-index:200;
  height:52px; display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; background:rgba(26,10,15,0.92); backdrop-filter:blur(10px);
}
.nav-back {
  display:flex; align-items:center; gap:8px;
  color:rgba(253,248,245,.65); text-decoration:none;
  font-family:'Cormorant Garamond',serif; font-size:.82rem;
  letter-spacing:.12em; text-transform:uppercase; transition:color .2s;
}
.nav-back:hover { color:var(--sakura); }
.nav-back svg { width:15px; height:15px; fill:currentColor; }
.nav-logo {
  font-family:'Noto Serif JP',serif; font-size:.88rem;
  letter-spacing:.28em; color:var(--cream); position:absolute; left:50%; transform:translateX(-50%);
}

/* ══ HERO BANNER（添付画像1参考）══ */
.hero-banner {
  margin-top:52px; position:relative;
  width:100%; height:180px; overflow:hidden;
  background:#111;
  display:flex; align-items:center; justify-content:center;
}
.hero-banner-img {
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; object-position:center 30%;
  filter:brightness(.55);
}
.hero-banner-text {
  position:relative; z-index:2;
  font-family:'Cormorant Garamond',serif; font-size:clamp(1.6rem,5vw,2.6rem);
  font-weight:300; letter-spacing:.6em; text-transform:uppercase;
  color:#fff;
}
.hero-banner-text::after {
  content:''; display:block; width:32px; height:1px;
  background:rgba(255,255,255,.5); margin:10px auto 0;
}

/* ══ PROFILE SECTION ══ */
.profile-section {
  max-width:1000px; margin:0 auto; padding:56px 24px 0;
  display:grid; grid-template-columns:280px 1fr; gap:52px; align-items:start;
}
.profile-photo-wrap { position:relative; }
.profile-photo {
  width:100%; aspect-ratio:3/4; overflow:hidden;
  background:#e0dbd8; border-radius:2px;
  box-shadow:8px 12px 40px rgba(0,0,0,.12);
}
.profile-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; display:block; }
.profile-gen-tag {
  position:absolute; top:14px; left:-10px;
  background:var(--accent); color:#fff;
  font-size:.65rem; letter-spacing:.12em; padding:4px 12px;
  font-family:'Cormorant Garamond',serif; font-weight:600;
}

.profile-info {}
.profile-name-ja {
  font-family:'Noto Serif JP',serif; font-size:clamp(1.8rem,4vw,2.8rem);
  font-weight:200; letter-spacing:.12em; color:var(--text); line-height:1.2;
  border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:8px;
}
.profile-name-ruby {
  font-family:'Cormorant Garamond',serif; font-size:.9rem;
  letter-spacing:.25em; color:#999; margin-bottom:32px;
}
.profile-table { width:100%; border-collapse:collapse; }
.profile-table tr { border-bottom:1px solid var(--border); }
.profile-table tr:first-child { border-top:1px solid var(--border); }
.profile-table th {
  font-size:.72rem; letter-spacing:.2em; color:#999; text-transform:uppercase;
  font-family:'Cormorant Garamond',serif; font-weight:400;
  padding:14px 0; width:100px; text-align:left; vertical-align:middle;
}
.profile-table td {
  font-size:.9rem; color:var(--text); padding:14px 0;
  letter-spacing:.04em; vertical-align:middle;
}
.profile-sns { margin-top:28px; display:flex; gap:10px; flex-wrap:wrap; }
.sns-btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 16px; border-radius:20px; border:1px solid var(--border);
  text-decoration:none; font-size:.75rem; color:#555; transition:all .2s;
  background:#fff; letter-spacing:.05em;
}
.sns-btn:hover { border-color:var(--sakura); color:var(--accent); }
.sns-btn svg { width:14px; height:14px; fill:currentColor; }

/* ══ SECTION COMMON ══ */
.content-wrap { max-width:1000px; margin:0 auto; padding:0 24px; }
.section-block { padding:64px 0 0; }
.section-block:last-child { padding-bottom:80px; }

.section-heading {
  font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:300;
  letter-spacing:.4em; text-transform:uppercase; color:var(--text);
  margin-bottom:6px;
}
.section-sub {
  font-size:.75rem; color:#aaa; letter-spacing:.08em; margin-bottom:32px;
}

/* ══ BLOG GRID（添付画像2参考）══ */
.blog-grid {
  display:grid; grid-template-columns:repeat(4,1fr); gap:0;
  border-top:1px solid var(--border);
}
.blog-card {
  display:block; text-decoration:none; color:inherit;
  border-right:1px solid var(--border);
  padding-bottom:16px;
}
.blog-card:last-child { border-right:none; }
.blog-thumb {
  width:100%; aspect-ratio:1/1; overflow:hidden; background:#e8e8e8;
  position:relative; margin-bottom:12px;
}
.blog-thumb img {
  width:100%; height:100%; object-fit:cover; display:block;
  transition:transform .5s; filter:brightness(.97);
}
.blog-card:hover .blog-thumb img { transform:scale(1.04); }
.blog-thumb-icon {
  position:absolute; bottom:10px; right:10px;
  width:34px; height:34px; border-radius:50%; border:2px solid #fff;
  overflow:hidden; background:#ccc;
}
.blog-thumb-icon img { width:100%; height:100%; object-fit:cover; }
.blog-card-meta { padding:0 12px; }
.blog-card-date { font-size:.72rem; color:var(--accent); letter-spacing:.06em; margin-bottom:2px; }
.blog-card-member { font-size:.75rem; color:#888; float:right; }
.blog-card-title { font-size:.82rem; color:#333; line-height:1.55; margin-top:4px; clear:both; }

/* ══ NEWS / SCHEDULE 2カラム（添付画像3参考）══ */
.news-schedule-grid {
  display:grid; grid-template-columns:1fr 1px 1fr; gap:0 40px;
}
.ns-divider { background:var(--border); }
.ns-col {}
.ns-col-title {
  font-family:'Cormorant Garamond',serif; font-size:1.4rem; font-weight:300;
  letter-spacing:.4em; text-transform:uppercase; color:var(--text);
  margin-bottom:4px;
}
.ns-col-sub { font-size:.72rem; color:#aaa; letter-spacing:.06em; margin-bottom:24px; }

.ns-list { display:flex; flex-direction:column; gap:0; }
.ns-item {
  padding:16px 0; border-bottom:1px solid var(--border); display:flex;
  flex-direction:column; gap:6px;
}
.ns-item:first-child { border-top:1px solid var(--border); }
.ns-item-top { display:flex; align-items:center; gap:10px; }
.ns-tag {
  font-size:.62rem; padding:3px 10px; background:var(--text); color:#fff;
  letter-spacing:.08em; white-space:nowrap; font-family:'Cormorant Garamond',serif;
}
.ns-tag.media  { background:#333; }
.ns-tag.live   { background:var(--accent); }
.ns-tag.haishin{ background:#2e7ec5; }
.ns-tag.other  { background:#888; }

.ns-date { font-size:.78rem; color:#888; letter-spacing:.05em; }
.ns-time { font-size:.78rem; color:var(--accent); letter-spacing:.04em; }
.ns-text { font-size:.83rem; color:#333; line-height:1.7; }

footer {
  text-align:center; padding:28px 20px; border-top:1px solid var(--border);
  font-size:.7rem; color:#bbb; letter-spacing:.2em;
  font-family:'Cormorant Garamond',serif; background:var(--bg);
}

/* ── responsive ── */
@media (max-width:720px) {
  .profile-section { grid-template-columns:1fr; gap:32px; }
  .profile-photo-wrap { max-width:240px; }
  .news-schedule-grid { grid-template-columns:1fr; gap:0; }
  .ns-divider { display:none; }
  .ns-col:last-child { padding-top:40px; }
  .blog-grid { grid-template-columns:repeat(2,1fr); }
  .blog-card:nth-child(2) { border-right:none; }
  .blog-card:nth-child(3) { border-right:1px solid var(--border); border-top:1px solid var(--border); }
  .blog-card:nth-child(4) { border-right:none; border-top:1px solid var(--border); }
}
</style>
</head>

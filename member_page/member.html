<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member | 櫻坂46</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;700&family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root { --sakura:#f2a7b8; --deep:#1a0a0f; --cream:#fdf8f5; --gold:#c9a96e; --accent:#c0004e; --border:#e8e8e8; }
html { scroll-behavior:smooth; }
body { font-family:'Noto Sans JP',sans-serif; background:#fafafa; color:#222; min-height:100vh; }

nav { position:fixed; top:0; left:0; right:0; z-index:100; padding:16px 24px; display:flex; align-items:center; gap:16px; background:rgba(26,10,15,0.92); backdrop-filter:blur(8px); }
.nav-back { display:flex; align-items:center; gap:8px; color:rgba(253,248,245,0.7); text-decoration:none; font-size:.82rem; letter-spacing:.1em; text-transform:uppercase; font-family:'Cormorant Garamond',serif; transition:color .2s; }
.nav-back:hover { color:var(--sakura); }
.nav-back svg { width:16px; height:16px; fill:currentColor; }
.nav-divider { width:1px; height:18px; background:rgba(255,255,255,.2); }
.nav-title { font-family:'Noto Serif JP',serif; font-size:.95rem; letter-spacing:.25em; color:var(--cream); }

.page-header { margin-top:56px; padding:52px 0 40px; text-align:center; background:linear-gradient(160deg,#1a0a0f 0%,#2d0f1e 60%,#1a0a0f 100%); position:relative; overflow:hidden; }
.page-header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:linear-gradient(to right,transparent,var(--gold),transparent); }
.page-header-title { font-family:'Cormorant Garamond',serif; font-size:clamp(2rem,6vw,3.5rem); font-weight:300; letter-spacing:.5em; text-transform:uppercase; background:linear-gradient(135deg,#fff 0%,var(--sakura) 50%,var(--gold) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.page-header-sub { font-size:.78rem; color:rgba(253,248,245,.4); letter-spacing:.3em; margin-top:.8rem; text-transform:uppercase; font-family:'Cormorant Garamond',serif; }

/* GEN TABS */
.gen-tabs { display:flex; gap:0; max-width:700px; margin:36px auto 0; padding:0 24px; border-bottom:2px solid var(--border); }
.gen-tab { padding:12px 28px; font-size:.85rem; letter-spacing:.1em; color:#888; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .2s; background:none; border-top:none; border-left:none; border-right:none; font-family:'Noto Sans JP',sans-serif; white-space:nowrap; }
.gen-tab:hover { color:#333; }
.gen-tab.active-2 { color:#c0004e; border-bottom-color:#c0004e; }
.gen-tab.active-3 { color:#7a4a9e; border-bottom-color:#7a4a9e; }
.gen-tab.active-4 { color:#2e7ec5; border-bottom-color:#2e7ec5; }
.gen-tab.active-all { color:#333; border-bottom-color:#333; }

/* GRID */
.member-wrap { max-width:1100px; margin:0 auto; padding:36px 24px 80px; }
.member-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:24px 16px; }

.member-card { display:block; text-decoration:none; color:inherit; cursor:pointer; }
.member-photo { width:100%; aspect-ratio:3/4; overflow:hidden; background:#e8e8e8; position:relative; border-radius:2px; }
.member-photo img { width:100%; height:100%; object-fit:cover; object-position:top center; transition:transform .5s,filter .4s; display:block; filter:grayscale(8%); }
.member-card:hover .member-photo img { transform:scale(1.07); filter:grayscale(0%); }
.member-gen-badge { position:absolute; top:8px; left:8px; font-size:.6rem; padding:2px 7px; border-radius:3px; font-weight:700; letter-spacing:.06em; }
.badge-2 { background:rgba(192,0,78,.85); color:#fff; }
.badge-3 { background:rgba(122,74,158,.85); color:#fff; }
.badge-4 { background:rgba(46,126,197,.85); color:#fff; }

.member-info { margin-top:8px; padding:0 2px; }
.member-name { font-size:.82rem; color:#222; letter-spacing:.03em; line-height:1.4; transition:color .2s; }
.member-card:hover .member-name { color:var(--accent); }
.member-ruby { font-size:.67rem; color:#999; margin-top:2px; letter-spacing:.04em; }

footer { text-align:center; padding:28px 20px; border-top:1px solid #eee; font-size:.72rem; color:#aaa; letter-spacing:.2em; font-family:'Cormorant Garamond',serif; background:#fff; }

@media (max-width:1024px) { .member-grid { grid-template-columns:repeat(4,1fr); } }
@media (max-width:600px)  { .member-grid { grid-template-columns:repeat(3,1fr); gap:16px 10px; } .gen-tab { padding:10px 16px; font-size:.78rem; } }
@media (max-width:400px)  { .member-grid { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<nav>
  <a href="sakurazaka.html" class="nav-back"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Back</a>
  <div class="nav-divider"></div>
  <span class="nav-title">櫻坂46</span>
</nav>

<div class="page-header">

  {id:'moriya-hana',     gen:4, name:'守屋 花菜', ruby:'もりや はな',        vid:'tnBbAvPfJv8'},
];

const BADGE={2:'badge-2',3:'badge-3',4:'badge-4'};
const ACTIVE_CLS={all:'active-all',2:'active-2',3:'active-3',4:'active-4'};

function render(filter){
  const list=filter==='all'?members:members.filter(m=>m.gen==filter);
  document.getElementById('memberGrid').innerHTML=list.map(m=>`
    <a href="member_detail.html?id=${m.id}" class="member-card">
      <div class="member-photo">
        <img src="https://img.youtube.com/vi/${m.vid}/mqdefault.jpg" alt="${m.name}" draggable="false">
        <span class="member-gen-badge ${BADGE[m.gen]}">${m.gen}期</span>
      </div>
      <div class="member-info">
        <p class="member-name">${m.name}</p>
        <p class="member-ruby">${m.ruby}</p>
      </div>
    </a>`).join('');
}

document.getElementById('genTabs').addEventListener('click',e=>{
  const btn=e.target.closest('.gen-tab'); if(!btn) return;
  document.querySelectorAll('.gen-tab').forEach(b=>b.className='gen-tab');
  const g=btn.dataset.gen;
  btn.classList.add(ACTIVE_CLS[g]||'active-all');
  render(g);
});
render('all');
</script>
